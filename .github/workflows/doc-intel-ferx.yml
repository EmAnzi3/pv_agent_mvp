name: Doc Intel FER X rankings (GSE) and 'vicini al cantiere'
# Matches the GSE FER X awarded plants (doc_intel/data/ferx_awarded.json, imported by hand from the GSE
# Table A PDFs: the GSE site refuses cloud downloads) to radar projects and their cards.
# Saves ferx/awarded.json, ferx/matches.json (PV radar) and ferx/wind_matches.json (wind radar) on the memory branch. On a pull request: dry run only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/data.json'        # new radar records get the FER X badge right after the push
  schedule:
    - cron: '45 5 * * *'      # daily, after the night cards: new cards bring new proponent VAT numbers
  pull_request:
    paths:
      - 'doc_intel/ferx.py'
      - 'doc_intel/readiness.py'
      - 'doc_intel/data/ferx_awarded.json'
      - 'docs/wind/data/**'
      - '.github/workflows/doc-intel-ferx.yml'
permissions:
  contents: write
jobs:
  ferx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests beautifulsoup4 pypdf pymupdf
      - name: Memory branch
        run: |
          git config user.name "doc-intel-bot"
          git config user.email "doc-intel-bot@users.noreply.github.com"
          git fetch -q origin doc-intel-state:doc-intel-state
          git worktree add -q .mem doc-intel-state
      - name: Rankings and match
        run: python -m doc_intel ferx --data docs/data.json --memory .mem --annotate
      - name: Vicini al cantiere (phase, score and reasons per project)
        run: python -m doc_intel readiness --data docs/data.json --memory .mem
      - name: Save on the memory branch
        if: github.event_name != 'pull_request'
        run: |
          cd .mem && git add ferx readiness && (git diff --cached --quiet && exit 0 || git commit -q -m "doc-intel ferx: GSE rankings matched to radar projects (run ${{ github.run_id }})")
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin doc-intel-state || git rebase --abort 2>/dev/null
            git push -q origin HEAD:doc-intel-state && exit 0
            sleep $((i * 5))
          done
          exit 1
