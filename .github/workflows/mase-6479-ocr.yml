name: MASE 6479 OCR annex pilot
on:
  pull_request:
    paths:
      - 'experiments/mase_6479_ocr.py'
      - '.github/workflows/mase-6479-ocr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng
          python -m pip install requests pymupdf
      - name: OCR two problematic image-only MASE PDFs
        run: python experiments/mase_6479_ocr.py 2>&1 | tee ocr.log
      - name: Upload OCR report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mase-6479-ocr
          path: |
            ocr.log
            reports/crawl4ai/mase-6479-ocr.json
          retention-days: 14
          if-no-files-found: warn
