name: Wind regional probe (temporary)
on:
  pull_request:
    paths: ['.github/workflows/wind-regional-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q requests beautifulsoup4 python-dotenv openpyxl
      - name: Basilicata and Sicilia (CSV only, no SI-VVI page)
        run: |
          python - <<'PY'
          import json, app.collectors.sicilia as sic
          sic.DETAIL_MAX_PER_RUN = 0          # never touch si-vvi from the cloud
          from app.collectors.wind_regional import run, LAST_STATS
          run(["basilicata", "sicilia"], out="probe.json")
          d = json.load(open("probe.json"))
          from collections import Counter
          print("::notice title=probe count::" + json.dumps(Counter(r["source"] for r in d["rows"])))
          for src in ("basilicata", "sicilia"):
              rows = [r for r in d["rows"] if r["source"] == src]
              print(f"::notice title=probe {src}::" + " || ".join(f"{r['payload'].get('power')} {r['payload'].get('municipalities')} {r['payload'].get('proponent')} {r['title'][:70]}" for r in rows[:6])[:950])
          PY
