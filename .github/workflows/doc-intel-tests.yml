name: Doc Intel toolbox tests (offline)
on:
  pull_request:
    paths:
      - 'doc_intel/**'
      - 'tests/test_doc_intel.py'
      - 'tests/doc_intel_fixtures.py'
      - '.github/workflows/doc-intel-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System OCR and PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ita poppler-utils
      - run: python -m pip install pymupdf pypdf requests beautifulsoup4
      - name: Unit and integration tests (no network)
        run: python -m unittest -v tests.test_doc_intel tests.test_evidence_toolbox
      - name: Same tests without PyMuPDF (fallback backends)
        run: |
          python -m pip uninstall -y pymupdf
          python -m unittest tests.test_doc_intel
