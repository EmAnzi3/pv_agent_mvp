name: Doc Intel portal exploration (to write adapters)
# Dumps links, API calls and response bodies of a few record pages. Review only, nothing is saved.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Record URLs separated by spaces'
        required: true
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Explore
        env:
          URLS: ${{ inputs.urls }}
        run: python -m doc_intel explore $URLS --out reports/explore.json --annotate
