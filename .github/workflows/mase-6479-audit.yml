name: Troia Sun targeted context audit
on:
  pull_request:
    paths:
      - 'experiments/mase_6479_targeted_audit.py'
      - '.github/workflows/mase-6479-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pymupdf
      - name: Inspect source page context
        run: python experiments/mase_6479_targeted_audit.py > audit.log 2>&1
      - name: Upload audited context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mase-6479-source-context
          path: |
            audit.log
            reports/crawl4ai/mase-6479-targeted-audit.json
          retention-days: 14
